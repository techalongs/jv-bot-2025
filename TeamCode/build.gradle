import java.time.LocalDateTime
import java.time.ZoneId
import java.time.format.DateTimeFormatter

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.


// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    // Config to enable showing code version on driver station
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        buildConfigField "String", "GIT_COMMIT", "\"${getGitCommit()}\""
        buildConfigField "String", "GIT_BRANCH", "\"${getGitBranch()}\""
        buildConfigField "String", "BUILD_DATE", "\"${getBuildDate()}\""
        buildConfigField "boolean", "GIT_DIRTY", "${isGitDirty()}"
        buildConfigField "String", "BUILDER", "\"${getBuilder()}\""
    }
}

repositories {
    mavenCentral()
    google()
    // Pedro Pathing
    maven { url = 'https://maven.pedropathing.com' }
    maven { url = "https://mymaven.bylazar.com/releases" }
    // FTCLib (SolversLib)
    maven { url = "https://repo.dairy.foundation/releases" }
    maven { url = "https://repo.dairy.foundation/snapshots" }
    // FTC Dashboard
    maven { url = 'https://maven.brott.dev/' }
}

dependencies {
    implementation project(':FtcRobotController')
    annotationProcessor files('lib/OpModeAnnotationProcessor.jar')
    // Pedro Pathing
    implementation 'com.pedropathing:ftc:2.0.1'
    implementation 'com.pedropathing:telemetry:0.0.6'
    implementation 'com.bylazar:fullpanels:1.0.2'
    // FTCLib (SolversLib)
    implementation "org.solverslib:core:SNAPSHOT-7cdcc66"
    implementation "org.solverslib:pedroPathing:SNAPSHOT-7cdcc66"
    // FTC Dashboard
    implementation "com.acmerobotics.dashboard:dashboard:0.4.17"
}

def getGitCommit() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (ignored) {
        return "unknown"
    }
}

def getGitBranch() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (ignored) {
        return "unknown"
    }
}

def getBuilder() {
    return System.getProperty("user.name") ?: "unknown"
}

def isGitDirty() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'status', '--porcelain'
            standardOutput = stdout
        }
        return !stdout.toString().trim().isEmpty()
    } catch (ignored) {
        return false
    }
}

def getBuildDate() {
    LocalDateTime.now(ZoneId.of("America/Phoenix")).format(DateTimeFormatter.ISO_LOCAL_DATE_TIME)
}
